<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050914">
  <title>Message Sent | RAMIKA BRO TECH</title>
  <link rel="icon" href="assets/logo.jfif">
  <link rel="stylesheet" href="style.css">
  <style>
    .thanks-wrap{min-height:78vh;display:grid;place-items:center;padding:40px 20px;text-align:center}
    .thanks-card{max-width:620px;padding:48px 28px;background:#0a1427;border:1px solid #167bff66;border-radius:14px;box-shadow:0 0 70px #087bff20}
    .check{width:64px;height:64px;margin:0 auto 25px;border-radius:50%;display:grid;place-items:center;background:#052d4c;border:1px solid #00dfff;color:#00e5ff;font-size:32px}
    .thanks-card p{color:#a9bad3;line-height:1.8}
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/logo.jfif" alt="RK Bro Tech logo"><span><b>RAMIKA</b><strong>BRO TECH</strong></span></a>
  </header>
  <main class="thanks-wrap">
    <div class="thanks-card">
      <div class="check">✓</div>
      <div class="eyebrow" style="justify-content:center">MESSAGE RECEIVED</div>
      <h1 style="font-size:clamp(30px,5vw,48px)">THANK <span class="gradient-text">YOU!</span></h1>
      <p>Your message has been submitted. Thanks for contacting Ramika Bro Tech — we appreciate you reaching out.</p>
      <a class="button button-primary" href="index.html">Back to Home <span>↗</span></a>
    </div>
  </main>
</body>
</html>
